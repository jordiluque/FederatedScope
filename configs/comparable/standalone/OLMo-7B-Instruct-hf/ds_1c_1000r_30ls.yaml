criterion:
  type: CrossEntropyLoss
data:
  root: data/
  splits:
  - 0.0319999999
  - 0.0006666666
  - 0.0006666666
  splitter: iid
  type: alpaca@llm
dataloader:
  batch_size: 1
device: 1
early_stop:
  patience: 0
eval:
  count_flops: false
  freq: 10
  metrics:
  - loss
expname_tag: ds_1c_1000r_30ls
federate:
  client_num: 1
  master_port: 29340
  method: FedAvg
  mode: standalone
  online_aggr: false
  process_num: 1
  save_to: models/comparable/standalone/OLMo-7B-Instruct-hf/ds_1c_1000r_30ls.ckpt
  share_local_model: true
  total_round_num: 1000
llm:
  adapter:
    args:
    - adapter_method: lora
      adapter_package: peft
      lora_alpha: 16
      lora_dropout: 0.05
      r: 8
      target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      - lm_head
    use: true
  chat:
    max_len: 2000
  deepspeed:
    ds_config: federatedscope/llm/baseline/deepspeed/ds_config_4bs.json
    use: true
  tok_len: 1000
model:
  type: allenai/OLMo-7B-Instruct-hf@huggingface_llm
train:
  batch_or_epoch: batch
  is_enable_half: true
  local_update_steps: 30
  optimizer:
    lr: 0.0003
    weight_decay: 0.0
trainer:
  type: llmtrainer
use_gpu: true
